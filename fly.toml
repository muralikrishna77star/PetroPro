app = "petropro-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "4000"
  HOST = "0.0.0.0"
  DB_PATH = "/repo/data/petropro.db"

[[mounts]]
  source = "petropro_data"
  destination = "/repo/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
